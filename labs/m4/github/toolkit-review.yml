# Module 4 stretch (c): run YOUR plugin's skill in Actions. Replace WORKSHOP_ORG before committing.
name: Toolkit Review
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  toolkit-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/WORKSHOP_ORG/claude-marketplace.git"
          plugins: "codebase-toolkit@WORKSHOP_ORG-marketplace"
          prompt: "/codebase-toolkit:code-reviewer app/ security — post a single summary comment on ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--max-turns 12 --allowedTools "Bash(gh pr comment *)"'
